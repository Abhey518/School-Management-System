<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers - SMS</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="admin.css">
    <script src="../shared/theme.js"></script>
    <style>
        .container { max-width: 1400px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">SMS Admin</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="teachers.html" class="active">Teachers</a>
            <a href="classes.html">Classes</a>
            <a href="subjects.html">Subjects</a>
            <a href="marks-approval.html">Marks Approval</a>
            <a href="timetable.html">Timetable</a>
            <div style="position: relative; display: inline-block;">
                <a href="#" onclick="toggleNotifications(event)" style="position: relative; padding: 0.5rem 0.75rem;">
                    🔔
                    <span id="notificationBadge" style="display: none; position: absolute; top: 0; right: 0; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; text-align: center; line-height: 18px; font-weight: bold;"></span>
                </a>
            </div>
            <a href="#" onclick="toggleSettings(event)">⚙️</a>
            <a href="../index.html">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Manage Teachers</h1>
            <button onclick="openAddTeacherModal()" class="btn btn-primary">+ Add New Teacher</button>
        </div>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Teachers List</h2>
                <button onclick="clearFilters()" class="btn">Clear Filters</button>
            </div>
            
            <!-- Filter Section -->
            <div style="display: grid; grid-template-columns: 150px 200px 2fr 140px; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: #f5f5f5; border-radius: 8px;">
                <div>
                    <label style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem; font-weight: 500;">Teacher Grade</label>
                    <select id="filterTeacherGrade" style="width: 100%; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem;">
                        <option value="">All Grades</option>
                        <option value="Grade 1">Grade 1</option>
                        <option value="Grade 2">Grade 2</option>
                        <option value="Grade 3">Grade 3</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem; font-weight: 500;">Class</label>
                    <select id="filterClass" style="width: 100%; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem;">
                        <option value="">All Classes</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem; font-weight: 500;">Subject</label>
                    <select id="filterSubject" style="width: 100%; padding: 0.4rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem;">
                        <option value="">All Subjects</option>
                    </select>
                </div>
                <div style="align-self: flex-end;">
                    <button onclick="applyFilters()" class="btn btn-primary" style="width: 100%; padding: 0.4rem; font-size: 0.9rem;">Apply Filters</button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table id="teachersTable">
                    <thead>
                        <tr>
                            <th style="text-align: center;">Name with Initials</th>
                            <th style="text-align: center;">Teacher Grade</th>
                            <th style="text-align: center;">Appointed Date</th>
                            <th style="text-align: center;">Contact Number</th>
                            <th style="text-align: center;">Subjects</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="teachersTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Teacher Modal -->
    <div id="addTeacherModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
        <div style="background: white; max-width: 800px; margin: 2rem auto; border-radius: 8px; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Add New Teacher</h2>
                <button onclick="closeAddTeacherModal()" class="btn">Close</button>
            </div>
            <form id="addTeacherForm">
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="modalFullName" required>
                    </div>
                    <div class="form-group">
                        <label>Name with Initials *</label>
                        <input type="text" id="modalNameWithInitials" required placeholder="e.g., A.B.C. Perera">
                    </div>
                    <div class="form-group">
                        <label>Appointed Date *</label>
                        <input type="date" id="modalAppointedDate" required>
                    </div>
                    <div class="form-group">
                        <label>Teacher Grade *</label>
                        <select id="modalTeacherGrade" required>
                            <option value="">Select Grade</option>
                            <option value="Grade 1">Grade 1</option>
                            <option value="Grade 2">Grade 2</option>
                            <option value="Grade 3">Grade 3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" id="modalContactNumber" placeholder="+94xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact</label>
                        <input type="tel" id="modalEmergencyContact" placeholder="+94xxxxxxxxx">
                    </div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Add Teacher</button>
                    <button type="button" onclick="closeAddTeacherModal()" class="btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Teacher Details Modal -->
    <div id="teacherModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
        <div style="background: white; max-width: 700px; margin: 2rem auto; border-radius: 8px; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Teacher Details</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <div style="position: relative;">
                        <button onclick="toggleAdditionalActions()" class="btn" style="padding: 0.5rem 1rem;">Additional Actions ▼</button>
                        <div id="additionalActionsDropdown" style="display: none; position: absolute; right: 0; top: 100%; margin-top: 0.25rem; background: white; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); min-width: 150px; z-index: 1001;">
                            <button onclick="deleteTeacherFromModal()" class="btn btn-danger" style="width: 100%; text-align: left; border-radius: 0; margin: 0;">Delete Teacher</button>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="btn">Close</button>
                </div>
            </div>
            <div id="teacherDetailsContent"></div>
        </div>
    </div>

    <!-- Edit Teacher Modal -->
    <div id="editTeacherModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
        <div style="background: white; max-width: 800px; margin: 2rem auto; border-radius: 8px; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Edit Teacher</h2>
                <button onclick="closeEditTeacherModal()" class="btn">Close</button>
            </div>
            <form id="editTeacherForm">
                <input type="hidden" id="editTeacherId">
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="editFullName" required>
                    </div>
                    <div class="form-group">
                        <label>Name with Initials *</label>
                        <input type="text" id="editNameWithInitials" required placeholder="e.g., A.B.C. Perera">
                    </div>
                    <div class="form-group">
                        <label>Appointed Date *</label>
                        <input type="date" id="editAppointedDate" required>
                    </div>
                    <div class="form-group">
                        <label>Teacher Grade *</label>
                        <select id="editTeacherGrade" required>
                            <option value="">Select Grade</option>
                            <option value="Grade 1">Grade 1</option>
                            <option value="Grade 2">Grade 2</option>
                            <option value="Grade 3">Grade 3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" id="editContactNumber" placeholder="+94xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact</label>
                        <input type="tel" id="editEmergencyContact" placeholder="+94xxxxxxxxx">
                    </div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Update Teacher</button>
                    <button type="button" onclick="closeEditTeacherModal()" class="btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase.js"></script>
    <script src="../shared/api.js"></script>
    <script src="admin.js"></script>
    <script src="admin-navbar.js"></script>
    <script>
        let allTeachers = [];
        let allClasses = [];
        let allSubjects = [];

        // Open Add Teacher Modal
        function openAddTeacherModal() {
            document.getElementById('addTeacherModal').style.display = 'block';
        }

        // Close Add Teacher Modal
        function closeAddTeacherModal() {
            document.getElementById('addTeacherModal').style.display = 'none';
            document.getElementById('addTeacherForm').reset();
        }

        // Load filter dropdown data
        async function loadFilterDropdowns() {
            try {
                // Load classes
                allClasses = await getClasses();
                const classSelect = document.getElementById('filterClass');
                classSelect.innerHTML = '<option value="">All Classes</option>' + 
                    allClasses.map(cls => 
                        `<option value="${cls.id}">${cls.class_name}</option>`
                    ).join('');

                // Load subjects - query subjects table directly to avoid duplicates
                const client = getSupabaseClient();
                const { data: subjectsData, error } = await client
                    .from('subjects')
                    .select('id, subject_code, subject_name')
                    .order('subject_code', { ascending: true });

                if (error) throw error;
                
                allSubjects = subjectsData || [];
                const subjectSelect = document.getElementById('filterSubject');
                subjectSelect.innerHTML = '<option value="">All Subjects</option>' + 
                    allSubjects.map(subject => 
                        `<option value="${subject.id}">${subject.subject_name}</option>`
                    ).join('');
            } catch (error) {
                console.error('Error loading filter data:', error);
            }
        }

        // Apply filters
        async function applyFilters() {
            const teacherGrade = document.getElementById('filterTeacherGrade').value;
            const classId = document.getElementById('filterClass').value;
            const subjectId = document.getElementById('filterSubject').value;

            try {
                let filteredTeachers = allTeachers;

                if (teacherGrade) {
                    filteredTeachers = filteredTeachers.filter(t => t.teacher_grade === teacherGrade);
                }

                if (classId) {
                    filteredTeachers = filteredTeachers.filter(t => 
                        t.classes_class_teacher?.some(c => c.id === classId) || 
                        t.classes_vice_class_teacher?.some(c => c.id === classId)
                    );
                }

                if (subjectId) {
                    filteredTeachers = filteredTeachers.filter(t => 
                        t.subject_teachers?.some(st => st.subject_id === subjectId)
                    );
                }

                displayTeachers(filteredTeachers);
            } catch (error) {
                console.error('Error applying filters:', error);
            }
        }

        // Clear all filters
        function clearFilters() {
            document.getElementById('filterTeacherGrade').value = '';
            document.getElementById('filterClass').value = '';
            document.getElementById('filterSubject').value = '';
            displayTeachers(allTeachers);
        }

        // Display teachers in table
        function displayTeachers(teachers) {
            const tbody = document.getElementById('teachersTableBody');
            
            if (teachers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No teachers found</td></tr>';
                return;
            }
            
            tbody.innerHTML = teachers.map(teacher => {
                const subjects = teacher.subject_teachers?.map(st => st.subjects?.subject_name).filter(Boolean).join(', ') || 'None';
                return `
                    <tr>
                        <td style="text-align: center;">${teacher.name_with_initials}</td>
                        <td style="text-align: center;">${teacher.teacher_grade}</td>
                        <td style="text-align: center;">${new Date(teacher.appointed_date).toLocaleDateString()}</td>
                        <td style="text-align: center;">${teacher.contact_number || 'N/A'}</td>
                        <td style="text-align: center;">${subjects}</td>
                        <td style="text-align: center;">
                            <button onclick="viewTeacherDetails('${teacher.id}')" class="btn btn-small">View Details</button>
                            <button onclick="openEditTeacherModal('${teacher.id}')" class="btn btn-small btn-primary">Edit</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Load teachers list (sorted by most recently appointed)
        async function loadTeachers() {
            try {
                const teachers = await getTeachers();
                // Sort by appointed date (most recent first)
                allTeachers = teachers.sort((a, b) => 
                    new Date(b.appointed_date) - new Date(a.appointed_date)
                );
                displayTeachers(allTeachers);
            } catch (error) {
                console.error('Error loading teachers:', error);
                alert('Error loading teachers');
            }
        }

        // View teacher details
        async function viewTeacherDetails(id) {
            currentTeacherId = id;
            try {
                const teacher = await getTeacherById(id);
                const subjects = teacher.subject_teachers?.map(st => st.subjects?.subject_name).filter(Boolean).join(', ') || 'None';
                
                const content = document.getElementById('teacherDetailsContent');
                content.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                        <div><strong>Full Name:</strong> ${teacher.full_name}</div>
                        <div><strong>Name with Initials:</strong> ${teacher.name_with_initials}</div>
                        <div><strong>Teacher Grade:</strong> ${teacher.teacher_grade}</div>
                        <div><strong>Appointed Date:</strong> ${new Date(teacher.appointed_date).toLocaleDateString()}</div>
                        <div><strong>Contact Number:</strong> ${teacher.contact_number || 'N/A'}</div>
                        <div><strong>Emergency Contact:</strong> ${teacher.emergency_contact_number || 'N/A'}</div>
                        <div style="grid-column: 1 / -1;"><strong>Subjects:</strong> ${subjects}</div>
                    </div>
                `;
                
                document.getElementById('teacherModal').style.display = 'block';
            } catch (error) {
                console.error('Error loading teacher details:', error);
                alert('Error loading teacher details');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('teacherModal').style.display = 'none';
            document.getElementById('additionalActionsDropdown').style.display = 'none';
        }

        // Toggle additional actions dropdown
        function toggleAdditionalActions() {
            const dropdown = document.getElementById('additionalActionsDropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        // Delete teacher from modal
        let currentTeacherId = null;
        async function deleteTeacherFromModal() {
            if (currentTeacherId && confirm('Are you sure you want to delete this teacher? This action cannot be undone.')) {
                try {
                    await deleteTeacherById(currentTeacherId);
                    alert('Teacher deleted successfully!');
                    closeModal();
                    loadTeachers();
                } catch (error) {
                    console.error('Error deleting teacher:', error);
                    alert('Error deleting teacher: ' + error.message);
                }
            }
        }

        // Open Edit Teacher Modal
        async function openEditTeacherModal(id) {
            try {
                const teacher = await getTeacherById(id);
                
                document.getElementById('editTeacherId').value = teacher.id;
                document.getElementById('editFullName').value = teacher.full_name;
                document.getElementById('editNameWithInitials').value = teacher.name_with_initials;
                document.getElementById('editAppointedDate').value = teacher.appointed_date;
                document.getElementById('editTeacherGrade').value = teacher.teacher_grade;
                document.getElementById('editContactNumber').value = teacher.contact_number || '';
                document.getElementById('editEmergencyContact').value = teacher.emergency_contact_number || '';
                
                document.getElementById('editTeacherModal').style.display = 'block';
            } catch (error) {
                console.error('Error loading teacher for edit:', error);
                alert('Error loading teacher details');
            }
        }

        // Close Edit Teacher Modal
        function closeEditTeacherModal() {
            document.getElementById('editTeacherModal').style.display = 'none';
            document.getElementById('editTeacherForm').reset();
        }

        // Edit teacher form handler
        document.getElementById('editTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teacherId = document.getElementById('editTeacherId').value;
            const teacherData = {
                full_name: document.getElementById('editFullName').value,
                name_with_initials: document.getElementById('editNameWithInitials').value,
                appointed_date: document.getElementById('editAppointedDate').value,
                teacher_grade: document.getElementById('editTeacherGrade').value,
                contact_number: document.getElementById('editContactNumber').value || null,
                emergency_contact_number: document.getElementById('editEmergencyContact').value || null
            };
            
            try {
                await updateTeacher(teacherId, teacherData);
                alert('Teacher updated successfully!');
                closeEditTeacherModal();
                loadTeachers();
            } catch (error) {
                console.error('Error updating teacher:', error);
                alert('Error updating teacher: ' + error.message);
            }
        });

        // Add teacher form handler
        document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teacherData = {
                full_name: document.getElementById('modalFullName').value,
                name_with_initials: document.getElementById('modalNameWithInitials').value,
                appointed_date: document.getElementById('modalAppointedDate').value,
                teacher_grade: document.getElementById('modalTeacherGrade').value,
                contact_number: document.getElementById('modalContactNumber').value || null,
                emergency_contact_number: document.getElementById('modalEmergencyContact').value || null
            };
            
            try {
                await addTeacher(teacherData);
                alert('Teacher added successfully!');
                closeAddTeacherModal();
                loadTeachers();
            } catch (error) {
                console.error('Error adding teacher:', error);
                alert('Error adding teacher: ' + error.message);
            }
        });

        // Close modals on outside click
        document.getElementById('addTeacherModal').addEventListener('click', (e) => {
            if (e.target.id === 'addTeacherModal') closeAddTeacherModal();
        });

        document.getElementById('editTeacherModal').addEventListener('click', (e) => {
            if (e.target.id === 'editTeacherModal') closeEditTeacherModal();
        });

        document.getElementById('teacherModal').addEventListener('click', (e) => {
            if (e.target.id === 'teacherModal') {
                closeModal();
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('additionalActionsDropdown');
            const button = e.target.closest('button');
            if (dropdown && !button?.onclick?.toString().includes('toggleAdditionalActions')) {
                dropdown.style.display = 'none';
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await loadFilterDropdowns();
            await loadTeachers();
        });
    </script>
</body>
</html>
