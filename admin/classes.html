<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Classes - SMS</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">SMS Admin</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="teachers.html">Teachers</a>
            <a href="classes.html" class="active">Classes</a>
            <a href="subjects.html">Subjects</a>
            <a href="timetable.html">Timetable</a>
            <a href="../index.html">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Manage Classes</h1>
        
        <div class="card">
            <h2>Create New Class</h2>
            <form id="addClassForm">
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label>Grade *</label>
                        <select id="grade" required>
                            <option value="">Select Grade</option>
                            <option value="6">Grade 6</option>
                            <option value="7">Grade 7</option>
                            <option value="8">Grade 8</option>
                            <option value="9">Grade 9</option>
                            <option value="10">Grade 10</option>
                            <option value="11">Grade 11</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Class Letter *</label>
                        <select id="classLetter" required>
                            <option value="">Select Class Letter</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Class Teacher *</label>
                        <select id="classTeacher" required>
                            <option value="">Select Class Teacher</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Vice Class Teacher</label>
                        <select id="viceClassTeacher">
                            <option value="">Select Vice Class Teacher</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Class Monitor</label>
                        <select id="classMonitor">
                            <option value="">Select Class Monitor</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Vice Class Monitor</label>
                        <select id="viceClassMonitor">
                            <option value="">Select Vice Class Monitor</option>
                        </select>
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary">Create Class</button>
                    <button type="reset" class="btn">Reset Form</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Classes List</h2>
            <div class="table-responsive">
                <table id="classesTable">
                    <thead>
                        <tr>
                            <th>Class Name</th>
                            <th>Class Teacher</th>
                            <th>Vice Class Teacher</th>
                            <th>Monitors</th>
                            <th>Student Count</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="classesTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Class Details Modal -->
    <div id="classModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
        <div style="background: white; max-width: 700px; margin: 2rem auto; border-radius: 8px; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Class Details</h2>
                <button onclick="closeModal()" class="btn">Close</button>
            </div>
            <div id="classDetailsContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase.js"></script>
    <script src="../shared/api.js"></script>
    <script src="admin.js"></script>
    <script>
        let teachersData = [];
        let studentsData = [];

        // Load teachers for dropdown
        async function loadTeachersDropdown() {
            try {
                teachersData = await getTeachers();
                const selects = ['classTeacher', 'viceClassTeacher'];
                
                selects.forEach(selectId => {
                    const select = document.getElementById(selectId);
                    const baseHTML = selectId === 'classTeacher' ? 
                        '<option value="">Select Class Teacher</option>' : 
                        '<option value="">Select Vice Class Teacher</option>';
                    
                    select.innerHTML = baseHTML + teachersData.map(teacher => 
                        `<option value="${teacher.id}">${teacher.name_with_initials} (${teacher.teacher_grade})</option>`
                    ).join('');
                });
            } catch (error) {
                console.error('Error loading teachers:', error);
            }
        }

        // Load students for monitor dropdown (filtered by selected grade)
        async function loadStudentsForMonitors() {
            const grade = document.getElementById('grade').value;
            if (!grade) {
                document.getElementById('classMonitor').innerHTML = '<option value="">Select Class Monitor</option>';
                document.getElementById('viceClassMonitor').innerHTML = '<option value="">Select Vice Class Monitor</option>';
                return;
            }

            try {
                studentsData = await filterStudents({ grade: parseInt(grade) });
                const selects = ['classMonitor', 'viceClassMonitor'];
                
                selects.forEach(selectId => {
                    const select = document.getElementById(selectId);
                    const baseHTML = selectId === 'classMonitor' ? 
                        '<option value="">Select Class Monitor</option>' : 
                        '<option value="">Select Vice Class Monitor</option>';
                    
                    select.innerHTML = baseHTML + studentsData.map(student => 
                        `<option value="${student.id}">${student.name_with_initials} (${student.class_name})</option>`
                    ).join('');
                });
            } catch (error) {
                console.error('Error loading students:', error);
            }
        }

        // Load classes list
        async function loadClasses() {
            try {
                const classes = await getClasses();
                const tbody = document.getElementById('classesTableBody');
                
                if (classes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No classes found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = classes.map(cls => {
                    const monitors = [cls.class_monitor_name, cls.vice_class_monitor_name]
                        .filter(Boolean)
                        .join(', ') || 'Not assigned';
                    
                    return `
                        <tr>
                            <td>${cls.class_name}</td>
                            <td>${cls.class_teacher_name || 'Not Assigned'}</td>
                            <td>${cls.vice_class_teacher_name || 'Not Assigned'}</td>
                            <td>${monitors}</td>
                            <td>${cls.student_count || 0}</td>
                            <td>
                                <button onclick="viewClassDetails('${cls.id}')" class="btn btn-small">View Details</button>
                                <button onclick="deleteClass('${cls.id}')" class="btn btn-small btn-danger">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading classes:', error);
                alert('Error loading classes');
            }
        }

        // View class details
        async function viewClassDetails(id) {
            try {
                const cls = await getClassById(id);
                const content = document.getElementById('classDetailsContent');
                
                content.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                        <div><strong>Class Name:</strong> ${cls.class_name}</div>
                        <div><strong>Grade:</strong> ${cls.grade}</div>
                        <div><strong>Class Letter:</strong> ${cls.class_letter}</div>
                        <div><strong>Student Count:</strong> ${cls.student_count || 0}</div>
                        <div><strong>Class Teacher:</strong> ${cls.class_teacher_name || 'Not Assigned'}</div>
                        <div><strong>Vice Class Teacher:</strong> ${cls.vice_class_teacher_name || 'Not Assigned'}</div>
                        <div><strong>Class Monitor:</strong> ${cls.class_monitor_name || 'Not Assigned'}</div>
                        <div><strong>Vice Class Monitor:</strong> ${cls.vice_class_monitor_name || 'Not Assigned'}</div>
                    </div>
                `;
                
                document.getElementById('classModal').style.display = 'block';
            } catch (error) {
                console.error('Error loading class details:', error);
                alert('Error loading class details');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('classModal').style.display = 'none';
        }

        // Add event listener for grade selection to load students
        document.getElementById('grade').addEventListener('change', loadStudentsForMonitors);

        // Add class form handler
        document.getElementById('addClassForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const classData = {
                grade: parseInt(document.getElementById('grade').value),
                class_letter: document.getElementById('classLetter').value,
                class_teacher_id: document.getElementById('classTeacher').value,
                vice_class_teacher_id: document.getElementById('viceClassTeacher').value || null,
                class_monitor_id: document.getElementById('classMonitor').value || null,
                vice_class_monitor_id: document.getElementById('viceClassMonitor').value || null
            };
            
            try {
                await addClass(classData);
                alert('Class created successfully!');
                e.target.reset();
                loadClasses();
            } catch (error) {
                console.error('Error adding class:', error);
                alert('Error adding class: ' + error.message);
            }
        });

        // Delete class function
        async function deleteClass(id) {
            if (confirm('Are you sure you want to delete this class? This may affect student records.')) {
                try {
                    await deleteClassById(id);
                    alert('Class deleted successfully!');
                    loadClasses();
                } catch (error) {
                    console.error('Error deleting class:', error);
                    alert('Error deleting class: ' + error.message);
                }
            }
        }

        // Close modal on outside click
        document.getElementById('classModal').addEventListener('click', (e) => {
            if (e.target.id === 'classModal') closeModal();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await loadTeachersDropdown();
            await loadClasses();
        });
    </script>
</body>
</html>
