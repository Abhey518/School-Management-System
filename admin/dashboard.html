<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SMS</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .container { max-width: 1400px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">SMS Admin</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="teachers.html">Teachers</a>
            <a href="classes.html">Classes</a>
            <a href="subjects.html">Subjects</a>
            <a href="timetable.html">Timetable</a>
            <a href="../index.html">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Administrator Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Students</h3>
                <p class="stat-number" id="totalStudents">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Teachers</h3>
                <p class="stat-number" id="totalTeachers">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Classes</h3>
                <p class="stat-number" id="totalClasses">0</p>
            </div>
            <div class="stat-card">
                <h3>Today's Attendance</h3>
                <p class="stat-number" id="todayAttendance">0%</p>
            </div>
        </div>

        <div class="quick-actions">
            <h2>Quick Actions</h2>
            <div class="action-buttons">
                <button onclick="location.href='students.html'" class="btn btn-primary">Manage Students</button>
                <button onclick="location.href='teachers.html'" class="btn btn-primary">Manage Teachers</button>
                <button onclick="location.href='classes.html'" class="btn btn-primary">Manage Classes</button>
                <button onclick="location.href='timetable.html'" class="btn btn-primary">View Timetable</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase.js"></script>
    <script src="../shared/api.js"></script>
    <script src="admin.js"></script>
    <script>
        // Load dashboard statistics
        async function loadDashboardStats() {
            try {
                const students = await getStudents();
                const teachers = await getTeachers();
                const classes = await getClasses();
                
                document.getElementById('totalStudents').textContent = students.length;
                document.getElementById('totalTeachers').textContent = teachers.length;
                document.getElementById('totalClasses').textContent = classes.length;
                
                // Calculate today's attendance
                const today = new Date().toISOString().split('T')[0];
                const attendance = await getAttendanceByDate(today);
                if (students.length > 0) {
                    const attendanceRate = (attendance.filter(a => a.status).length / students.length * 100).toFixed(0);
                    document.getElementById('todayAttendance').textContent = attendanceRate + '%';
                }
            } catch (error) {
                console.error('Error loading dashboard stats:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', loadDashboardStats);
    </script>
</body>
</html>
