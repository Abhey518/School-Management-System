<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers - SMS</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">SMS Admin</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="teachers.html" class="active">Teachers</a>
            <a href="classes.html">Classes</a>
            <a href="timetable.html">Timetable</a>
            <a href="../index.html">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Manage Teachers</h1>
        
        <div class="card">
            <h2>Add New Teacher</h2>
            <form id="addTeacherForm">
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Name with Initials *</label>
                        <input type="text" id="nameWithInitials" required placeholder="e.g., A.B.C. Perera">
                    </div>
                    <div class="form-group">
                        <label>Appointed Date *</label>
                        <input type="date" id="appointedDate" required>
                    </div>
                    <div class="form-group">
                        <label>Teacher Grade *</label>
                        <select id="teacherGrade" required>
                            <option value="">Select Grade</option>
                            <option value="Grade 1">Grade 1</option>
                            <option value="Grade 2">Grade 2</option>
                            <option value="Grade 3">Grade 3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="tel" id="contactNumber" placeholder="+94xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact</label>
                        <input type="tel" id="emergencyContact" placeholder="+94xxxxxxxxx">
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary">Add Teacher</button>
                    <button type="reset" class="btn">Reset Form</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Teachers List</h2>
            <div class="table-responsive">
                <table id="teachersTable">
                    <thead>
                        <tr>
                            <th>Name with Initials</th>
                            <th>Teacher Grade</th>
                            <th>Appointed Date</th>
                            <th>Contact Number</th>
                            <th>Subjects</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="teachersTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Teacher Details Modal -->
    <div id="teacherModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
        <div style="background: white; max-width: 700px; margin: 2rem auto; border-radius: 8px; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Teacher Details</h2>
                <button onclick="closeModal()" class="btn">Close</button>
            </div>
            <div id="teacherDetailsContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase.js"></script>
    <script src="../shared/api.js"></script>
    <script src="admin.js"></script>
    <script>
        // Load teachers list
        async function loadTeachers() {
            try {
                const teachers = await getTeachers();
                const tbody = document.getElementById('teachersTableBody');
                
                if (teachers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No teachers found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = teachers.map(teacher => {
                    const subjects = teacher.subject_teachers?.map(st => st.subjects?.subject_name).filter(Boolean).join(', ') || 'None';
                    return `
                        <tr>
                            <td>${teacher.name_with_initials}</td>
                            <td>${teacher.teacher_grade}</td>
                            <td>${new Date(teacher.appointed_date).toLocaleDateString()}</td>
                            <td>${teacher.contact_number || 'N/A'}</td>
                            <td>${subjects}</td>
                            <td>
                                <button onclick="viewTeacherDetails('${teacher.id}')" class="btn btn-small">View Details</button>
                                <button onclick="deleteTeacher('${teacher.id}')" class="btn btn-small btn-danger">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading teachers:', error);
                alert('Error loading teachers');
            }
        }

        // View teacher details
        async function viewTeacherDetails(id) {
            try {
                const teacher = await getTeacherById(id);
                const subjects = teacher.subject_teachers?.map(st => st.subjects?.subject_name).filter(Boolean).join(', ') || 'None';
                
                const content = document.getElementById('teacherDetailsContent');
                content.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                        <div><strong>Full Name:</strong> ${teacher.full_name}</div>
                        <div><strong>Name with Initials:</strong> ${teacher.name_with_initials}</div>
                        <div><strong>Teacher Grade:</strong> ${teacher.teacher_grade}</div>
                        <div><strong>Appointed Date:</strong> ${new Date(teacher.appointed_date).toLocaleDateString()}</div>
                        <div><strong>Contact Number:</strong> ${teacher.contact_number || 'N/A'}</div>
                        <div><strong>Emergency Contact:</strong> ${teacher.emergency_contact_number || 'N/A'}</div>
                        <div style="grid-column: 1 / -1;"><strong>Subjects:</strong> ${subjects}</div>
                    </div>
                `;
                
                document.getElementById('teacherModal').style.display = 'block';
            } catch (error) {
                console.error('Error loading teacher details:', error);
                alert('Error loading teacher details');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('teacherModal').style.display = 'none';
        }

        // Add teacher form handler
        document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teacherData = {
                full_name: document.getElementById('fullName').value,
                name_with_initials: document.getElementById('nameWithInitials').value,
                appointed_date: document.getElementById('appointedDate').value,
                teacher_grade: document.getElementById('teacherGrade').value,
                contact_number: document.getElementById('contactNumber').value || null,
                emergency_contact_number: document.getElementById('emergencyContact').value || null
            };
            
            try {
                await addTeacher(teacherData);
                alert('Teacher added successfully!');
                e.target.reset();
                loadTeachers();
            } catch (error) {
                console.error('Error adding teacher:', error);
                alert('Error adding teacher: ' + error.message);
            }
        });

        // Delete teacher function
        async function deleteTeacher(id) {
            if (confirm('Are you sure you want to delete this teacher?')) {
                try {
                    await deleteTeacherById(id);
                    alert('Teacher deleted successfully!');
                    loadTeachers();
                } catch (error) {
                    console.error('Error deleting teacher:', error);
                    alert('Error deleting teacher');
                }
            }
        }

        // Close modal on outside click
        document.getElementById('teacherModal').addEventListener('click', (e) => {
            if (e.target.id === 'teacherModal') closeModal();
        });

        window.addEventListener('DOMContentLoaded', loadTeachers);
    </script>
</body>
</html>
